<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mój Projekt</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #0b1020;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --text-main: #e5e7eb;
            --text-muted: #94a3b8;
            --card-bg: rgba(255, 255, 255, 0.08);
            --border-glass: rgba(255, 255, 255, 0.15);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top, #111827, var(--bg-main));
            color: var(--text-main);
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 3rem 2.5rem;
            max-width: 480px;
            width: 90%;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
        }

        h1 {
            margin-top: 0;
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-muted);
            font-size: 1rem;
            margin: 1.2rem 0 2rem;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            padding: 0.8rem 1.8rem;
            background: linear-gradient(90deg, var(--accent), #818cf8);
            color: #020617;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            border-radius: 999px;
            transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
        }

        a:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 15px 30px rgba(56, 189, 248, 0.35);
            opacity: 0.95;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Witaj w moim projekcie!</h1>
        <p>Kliknij poniżej, aby przejść do projektu:</p>
        <a href="https://lab7-six.vercel.app" target="_blank">
            Otwórz mój projekt →
        </a>
    </div>

</body>
</html>
